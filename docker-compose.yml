# =============================================================================
# HAKI ERP — 容器编排
#
#   首次启动：docker compose up -d --build
#   灌入演示数据：docker compose --profile seed run --rm seed
#   访问：https://localhost（自签证书，浏览器需放行）
#
# 说明：应用只在内网暴露 3000，外部统一经 nginx 443 进入，避免与本地
#       dev server 的 3000 端口冲突。
# =============================================================================

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: haki
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-haki_dev_password}
      POSTGRES_DB: haki_erp
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U haki -d haki_erp"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://haki:${POSTGRES_PASSWORD:-haki_dev_password}@db:5432/haki_erp?schema=public
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_before_production}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://localhost}
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  # 演示数据一次性任务：轻量镜像（不编译 Next.js），只跑迁移与种子脚本
  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    profiles: ["seed"]
    environment:
      DATABASE_URL: postgresql://haki:${POSTGRES_PASSWORD:-haki_dev_password}@db:5432/haki_erp?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx tsx prisma/seed.ts"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/entrypoint.sh:/entrypoint.sh:ro
      - ./deploy/nginx/certs:/etc/nginx/certs
    entrypoint: ["sh", "/entrypoint.sh"]
    depends_on:
      - app

volumes:
  db_data: