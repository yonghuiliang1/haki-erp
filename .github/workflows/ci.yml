name: CI

# 代码推送即自动检查：类型检查 → 单元测试 → 生产构建。
# 发布环节单独走手动触发，需通过 production 环境的审批后才能构建交付镜像。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    name: 类型检查 / 测试 / 构建
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: haki_erp_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/haki_erp_ci?schema=public
      JWT_SECRET: ci-placeholder-secret-not-used-in-production
      NEXT_PUBLIC_API_URL: http://localhost:3000

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成 Prisma Client
        run: npx prisma generate

      - name: 应用数据库迁移
        run: npx prisma migrate deploy

      - name: 类型检查
        run: npx tsc --noEmit

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

  release-image:
    name: 构建交付镜像（手动确认）
    needs: verify
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # 在仓库 Settings → Environments 为 production 配置审批人，
    # 该 job 会等待人工确认后再执行。
    environment: production

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 构建生产镜像
        run: docker build -t haki-erp:${{ github.sha }} .